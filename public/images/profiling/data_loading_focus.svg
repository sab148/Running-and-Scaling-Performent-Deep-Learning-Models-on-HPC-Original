<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7fbf5"/>
      <stop offset="100%" stop-color="#eef6ea"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7cb342"/>
      <stop offset="100%" stop-color="#558b2f"/>
    </linearGradient>
    <filter id="soft" x="-2%" y="-2%" width="104%" height="110%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-opacity="0.13"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <rect width="1280" height="700" fill="url(#bg)"/>

  <!-- Title -->
  <rect x="28" y="12" width="1224" height="60" rx="14" fill="url(#hero)" filter="url(#soft)"/>
  <text x="640" y="38" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">Focus: DATA LOADING</text>
  <text x="640" y="58" text-anchor="middle" fill="#e8f5e9" font-size="15">Make sure loading is not what slows down each training step</text>

  <!-- LEFT -->
  <rect x="28" y="86" width="400" height="592" rx="14" fill="#ffffff" stroke="#7cb342" stroke-width="2.5" filter="url(#soft)"/>
  <rect x="28" y="86" width="400" height="46" rx="14" fill="#7cb342"/>
  <rect x="28" y="116" width="400" height="16" fill="#7cb342"/>
  <text x="228" y="116" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">What we want to do</text>

  <!-- 1 -->
  <circle cx="66" cy="172" r="16" fill="#7cb342"/>
  <text x="66" y="178" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">1</text>
  <text x="96" y="164" fill="#1b5e20" font-size="16" font-weight="700">Find the problem</text>
  <text x="96" y="186" fill="#2e7d32" font-size="14">Long :data_loading on main,</text>
  <text x="96" y="206" fill="#2e7d32" font-size="14">little / no CUDA HW under it?</text>
  <line x1="66" y1="192" x2="66" y2="222" stroke="#aed581" stroke-width="3.5"/>

  <!-- 2 -->
  <circle cx="66" cy="248" r="16" fill="#7cb342"/>
  <text x="66" y="254" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">2</text>
  <text x="96" y="240" fill="#1b5e20" font-size="16" font-weight="700">Add more workers</text>
  <text x="96" y="262" fill="#2e7d32" font-size="14">Raise num_workers (0-&gt;2-&gt;4...)</text>
  <text x="96" y="282" fill="#2e7d32" font-size="14">so batches load in parallel.</text>
  <line x1="66" y1="268" x2="66" y2="298" stroke="#aed581" stroke-width="3.5"/>

  <!-- 3 -->
  <circle cx="66" cy="324" r="16" fill="#7cb342"/>
  <text x="66" y="330" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">3</text>
  <text x="96" y="316" fill="#1b5e20" font-size="16" font-weight="700">Check the result</text>
  <text x="96" y="338" fill="#2e7d32" font-size="14">Step time better? Keep that count.</text>

  <!-- If not help callout -->
  <rect x="48" y="352" width="360" height="218" rx="10" fill="#fff8ea" stroke="#e2b45d" stroke-width="1.8"/>
  <text x="228" y="376" text-anchor="middle" fill="#8a5a00" font-size="15" font-weight="700">If workers do NOT help</text>
  <text x="62" y="400" fill="#6d4c00" font-size="14">and main still shows a long</text>
  <text x="62" y="420" fill="#6d4c00" font-size="14">:data_loading block, the limit is</text>
  <text x="62" y="440" fill="#6d4c00" font-size="14">I/O or CPU work in the DataLoader.</text>
  <text x="62" y="468" fill="#e65100" font-size="14" font-weight="700">Inspect pt_data_worker traces:</text>
  <text x="62" y="496" fill="#6d4c00" font-size="14">I/O wait? optimize I/O</text>
  <text x="62" y="516" fill="#6d4c00" font-size="13">(storage path, format, caching)</text>
  <text x="62" y="542" fill="#6d4c00" font-size="14">CPU compute? vectorize Dataset /</text>
  <text x="62" y="562" fill="#6d4c00" font-size="13">transforms inside the DataLoader</text>

  <!-- 4 -->
  <line x1="66" y1="574" x2="66" y2="598" stroke="#aed581" stroke-width="3.5"/>
  <circle cx="66" cy="624" r="16" fill="#558b2f"/>
  <text x="66" y="630" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">4</text>
  <text x="96" y="616" fill="#1b5e20" font-size="16" font-weight="700">Then move on</text>
  <text x="96" y="638" fill="#2e7d32" font-size="14">Loading OK? Fix H2D next</text>
  <text x="96" y="658" fill="#2e7d32" font-size="14">(pin_memory + non_blocking)</text>

  <!-- RIGHT -->
  <rect x="448" y="86" width="804" height="592" rx="14" fill="#ffffff" stroke="#7cb342" stroke-width="2.5" filter="url(#soft)"/>
  <rect x="448" y="86" width="804" height="46" rx="14" fill="#558b2f"/>
  <rect x="448" y="116" width="804" height="16" fill="#558b2f"/>
  <text x="850" y="116" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Single_GPU traces - open these in order</text>

  <!-- 00 -->
  <rect x="476" y="154" width="748" height="112" rx="12" fill="#fff8ea" stroke="#f0d965" stroke-width="2.5" filter="url(#soft)"/>
  <rect x="476" y="154" width="110" height="112" rx="12" fill="#f0d965"/>
  <rect x="562" y="154" width="24" height="112" fill="#f0d965"/>
  <text x="531" y="220" text-anchor="middle" fill="#6d4c00" font-size="26" font-weight="700">00</text>
  <text x="620" y="186" fill="#6d4c00" font-size="18" font-weight="700">Baseline (no workers)</text>
  <text x="620" y="212" fill="#8a5a00" font-size="15">num_workers=0, pin_memory=False, non_blocking=False</text>
  <text x="620" y="240" fill="#5b6b7c" font-size="15">Measure one step. Longest CPU stage? GPU busy or idle?</text>

  <line x1="850" y1="266" x2="850" y2="288" stroke="#5b6b7c" stroke-width="2.8" marker-end="url(#arr)"/>

  <!-- 01 -->
  <rect x="476" y="294" width="748" height="220" rx="12" fill="#e8f5e9" stroke="#7cb342" stroke-width="2.5" filter="url(#soft)"/>
  <rect x="476" y="294" width="110" height="220" rx="12" fill="#7cb342"/>
  <rect x="562" y="294" width="24" height="220" fill="#7cb342"/>
  <text x="531" y="412" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">01</text>
  <text x="620" y="326" fill="#1b5e20" font-size="18" font-weight="700">Add workers (data-loading fix)</text>
  <text x="620" y="352" fill="#2e7d32" font-size="15">num_workers=4, pin_memory=False, non_blocking=False</text>
  <text x="620" y="380" fill="#5b6b7c" font-size="15">Find pt_data_worker rows. Did main :data_loading shrink?</text>
  <text x="620" y="406" fill="#5b6b7c" font-size="15">If NOT and main still waits on a big loading block:</text>
  <text x="620" y="438" fill="#e65100" font-size="15" font-weight="700">Inspect the worker-level timeline</text>
  <text x="620" y="466" fill="#6d4c00" font-size="15">I/O heavy? optimize I/O (path, format, cache)</text>
  <text x="620" y="492" fill="#6d4c00" font-size="15">CPU heavy? vectorize Dataset / transforms</text>

  <line x1="850" y1="514" x2="850" y2="536" stroke="#5b6b7c" stroke-width="2.8" marker-end="url(#arr)"/>

  <!-- 02 -->
  <rect x="476" y="542" width="748" height="116" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5" filter="url(#soft)"/>
  <rect x="476" y="542" width="110" height="116" rx="12" fill="#ef6c00"/>
  <rect x="562" y="542" width="24" height="116" fill="#ef6c00"/>
  <text x="531" y="608" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">02</text>
  <text x="620" y="578" fill="#e65100" font-size="18" font-weight="700">Then fix data movement (H2D copy)</text>
  <text x="620" y="604" fill="#ef6c00" font-size="15">num_workers=4, pin_memory=True, non_blocking=True</text>
  <text x="620" y="632" fill="#5b6b7c" font-size="15">After loading is healthy, speed up CPU-&gt;GPU transfer.</text>
</svg>
