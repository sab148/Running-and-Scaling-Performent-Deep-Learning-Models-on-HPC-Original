<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>DataLoader workers animation</title>
<style>
  :root {
    --blue: #1565c0;
    --green: #558b2f;
    --orange: #ef6c00;
    --yellow: #f0d965;
    --disk: #5d4037;
    --purple: #6a1b9a;
    --ink: #023d6b;
    --muted: #607d8b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: "Segoe UI", "Helvetica Neue", Arial, Helvetica, sans-serif;
    color: var(--ink);
    background: #f4f7fb;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: geometricPrecision;
  }
  .wrap {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    padding: 10px 14px 8px;
  }
  .header { text-align: center; margin-bottom: 6px; flex: 0 0 auto; }
  .header h1 {
    margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.01em;
  }
  .stage {
    position: relative; flex: 1; min-height: 0;
    border-radius: 14px;
    background: #fff;
    border: 1.5px solid #d7dee8;
    overflow: hidden;
  }

  .pipe {
    position: absolute;
    left: 3%; right: 3%; top: 46%;
    height: 5px;
    background: linear-gradient(90deg, #bcaaa4 0%, #7cb342 28%, #f0d965 52%, #1565c0 76%, #8e24aa 100%);
    border-radius: 4px;
    opacity: 0.32;
    z-index: 0;
  }

  .node {
    position: absolute;
    border-radius: 14px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 8px 10px;
    border: 2.5px solid transparent;
    z-index: 1;
  }
  .node .badge {
    width: 34px; height: 34px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: #fff;
    margin-bottom: 6px;
  }
  .node .label { font-size: 15px; font-weight: 800; line-height: 1.15; }
  .node .sub {
    margin-top: 3px; font-size: 11px; font-weight: 700; color: #546e7a; line-height: 1.25;
  }
  .node .hint {
    margin-top: 5px; font-size: 12px; font-weight: 600; opacity: 0.95;
  }
  .node.active {
    outline: 3px solid rgba(2, 61, 107, 0.28);
    outline-offset: 2px;
  }
  .node.dim { opacity: 0.55; }

  .fs {
    left: 2%; top: 16%; width: 13%; height: 58%;
    background: #efebe9; border-color: #8d6e63; color: #3e2723;
  }
  .fs .badge { background: #6d4c41; }

  .worker {
    width: 13%; height: 24%;
    background: #e8f5e9; border-color: #7cb342; color: #1b5e20;
  }
  .worker .badge { background: #7cb342; }
  #w1 { left: 18%; top: 14%; }
  #w2 { left: 18%; top: 50%; }

  .queue {
    left: 35%; top: 10%; width: 18%; height: 70%;
    background: #fff8ea; border-color: #f0d965; color: #6d4c00;
    justify-content: flex-start; padding-top: 10px;
  }
  .queue .label { font-size: 16px; }
  .queue .cap {
    font-size: 12px; font-weight: 700; color: #8a5a00; margin: 3px 0 8px;
  }
  .slots {
    width: 86%; flex: 1;
    display: flex; flex-direction: column-reverse;
    gap: 6px;
  }
  .slot {
    height: 17%; border-radius: 10px;
    border: 2.5px dashed #e2b45d;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: #8a5a00;
  }
  .slot.filled {
    background: #ef6c00; border: 2.5px solid #e65100;
    border-style: solid; color: #fff;
  }

  .main {
    left: 57%; top: 16%; width: 18%; height: 58%;
    background: #e3f2fd; border-color: #1565c0; color: #0d47a1;
  }
  .main .badge { background: #1565c0; }

  .gpu {
    right: 2%; top: 20%; width: 19%; height: 50%;
    background: #f3e5f5; border-color: #8e24aa; color: #4a148c;
  }
  .gpu .badge { background: #6a1b9a; }

  .token {
    position: absolute; z-index: 20;
    width: 78px; height: 34px;
    margin: 0; padding: 0;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: #fff;
    pointer-events: none;
    opacity: 0;
    will-change: left, top, opacity;
  }
  .token.index { background: #1565c0; }
  .token.data  { background: #6d4c41; }
  .token.batch { background: #ef6c00; }
  .token.show { opacity: 1; }

  .status {
    position: absolute; left: 50%; bottom: 8px;
    transform: translateX(-50%);
    width: auto; max-width: 86%;
    height: 32px; line-height: 30px;
    background: #fff; border: 1.5px solid #cfd8dc;
    border-radius: 10px; padding: 0 14px;
    font-size: 13px; font-weight: 700; color: var(--ink);
    text-align: center; z-index: 30;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status.info { background: #e3f2fd; border-color: #90caf9; color: #0d47a1; }
  .status.disk { background: #efebe9; border-color: #bcaaa4; color: #4e342e; }
  .status.warn { background: #fff8ea; border-color: #f0d965; color: #6d4c00; }
  .status.ok   { background: #e8f5e9; border-color: #aed581; color: #1b5e20; }
  .status.gpu  { background: #f3e5f5; border-color: #ce93d8; color: #4a148c; }

  .step-pills {
    position: absolute; top: 10px; right: 2%;
    display: flex; flex-direction: column; gap: 5px; z-index: 15;
  }
  .pill {
    font-size: 11px; font-weight: 800;
    padding: 4px 10px; border-radius: 7px;
    background: #eceff1; color: #607d8b; border: 1.5px solid #cfd8dc;
    text-align: left;
  }
  .pill.on {
    background: #e8f5e9; color: #2e7d32; border-color: #aed581;
  }

  .legend {
    display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;
    padding-top: 7px; font-size: 12px; color: var(--muted); font-weight: 650;
    flex: 0 0 auto;
  }
  .legend i {
    display: inline-block; width: 11px; height: 11px; border-radius: 3px;
    margin-right: 5px; vertical-align: -1px;
  }
  .i-fs { background: #6d4c41; }
  .i-main { background: #1565c0; }
  .i-w { background: #7cb342; }
  .i-q { background: #f0d965; }
  .i-g { background: #6a1b9a; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>PyTorch DataLoader — 2 workers</h1>
  </div>

  <div class="stage" id="stage">
    <div class="pipe" aria-hidden="true"></div>

    <div class="step-pills">
      <div class="pill" id="p1">1 Index</div>
      <div class="pill" id="p2">2 FS read</div>
      <div class="pill" id="p3">3 RAM queue</div>
      <div class="pill" id="p4">4 Main→GPU</div>
    </div>

    <div class="node fs" id="fs">
      <div class="badge">FS</div>
      <div class="label">Filesystem</div>
      <div class="hint" id="fsHint">dataset files</div>
    </div>

    <div class="node worker" id="w1">
      <div class="badge">W1</div>
      <div class="label">Worker 1</div>
      <div class="hint" id="w1Hint">idle</div>
    </div>
    <div class="node worker" id="w2">
      <div class="badge">W2</div>
      <div class="label">Worker 2</div>
      <div class="hint" id="w2Hint">idle</div>
    </div>

    <div class="node queue" id="queue">
      <div class="label">RAM queue</div>
      <div class="cap" id="qHint">0 / 4 batches ready</div>
      <div class="slots">
        <div class="slot"></div>
        <div class="slot"></div>
        <div class="slot"></div>
        <div class="slot"></div>
      </div>
    </div>

    <div class="node main" id="main">
      <div class="badge">M</div>
      <div class="label">Main process</div>
      <div class="sub">training loop<br/>= next(loader)</div>
      <div class="hint" id="mainHint">waiting</div>
    </div>

    <div class="node gpu" id="gpu">
      <div class="badge">GPU</div>
      <div class="label">GPU</div>
      <div class="hint" id="gpuHint">waiting</div>
    </div>

    <div class="status" id="status">Starting...</div>
  </div>

  <div class="legend">
    <span><i class="i-fs"></i>Filesystem</span>
    <span><i class="i-w"></i>Workers</span>
    <span><i class="i-q"></i>RAM queue</span>
    <span><i class="i-main"></i>Main (= next + .to)</span>
    <span><i class="i-g"></i>GPU</span>
  </div>
</div>
<script>
(function () {
  const CAP = 4;
  const T_MOVE = 2200;
  const T_READ = 1600;
  const T_PAUSE = 1200;
  const T_TRAIN = 2000;
  const T_BOOT = 2000;

  const slots = Array.from(document.querySelectorAll('.slot'));
  const statusEl = document.getElementById('status');
  const qHint = document.getElementById('qHint');
  const fs = document.getElementById('fs');
  const fsHint = document.getElementById('fsHint');
  const w1 = document.getElementById('w1');
  const w2 = document.getElementById('w2');
  const w1Hint = document.getElementById('w1Hint');
  const w2Hint = document.getElementById('w2Hint');
  const gpu = document.getElementById('gpu');
  const gpuHint = document.getElementById('gpuHint');
  const mainHint = document.getElementById('mainHint');
  const main = document.getElementById('main');
  const queueEl = document.getElementById('queue');
  const stage = document.getElementById('stage');
  const pills = [1,2,3,4].map(n => document.getElementById('p' + n));

  let queue = [];
  let nextBatch = 1;
  let nextIdx = 0;
  let putLock = Promise.resolve();

  function withPutLock(fn) {
    const run = putLock.then(fn, fn);
    putLock = run.catch(() => {});
    return run;
  }

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }

  function setPill(n) {
    pills.forEach((p, i) => p.classList.toggle('on', i === n - 1));
  }

  function renderQueue() {
    slots.forEach((s, i) => {
      if (i < queue.length) {
        s.classList.add('filled');
        s.textContent = 'B' + queue[i];
      } else {
        s.classList.remove('filled');
        s.textContent = '';
      }
    });
    qHint.textContent = queue.length + ' / ' + CAP + ' batches ready';
  }

  function centerOf(el) {
    const sr = stage.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    return {
      x: Math.round(r.left - sr.left + r.width / 2),
      y: Math.round(r.top - sr.top + r.height / 2)
    };
  }

  function moveToken(kind, text, fromEl, toEl, duration) {
    return new Promise((resolve) => {
      const token = document.createElement('div');
      token.className = 'token ' + kind;
      token.textContent = text;
      stage.appendChild(token);
      const from = centerOf(fromEl);
      const to = centerOf(toEl);
      const dur = duration || T_MOVE;
      token.style.left = (from.x - 39) + 'px';
      token.style.top = (from.y - 17) + 'px';
      token.style.transition = 'none';
      token.offsetHeight;
      token.classList.add('show');
      requestAnimationFrame(() => {
        token.style.transition = 'left ' + dur + 'ms linear, top ' + dur + 'ms linear, opacity 0.2s linear';
        token.style.left = (to.x - 39) + 'px';
        token.style.top = (to.y - 17) + 'px';
      });
      setTimeout(() => {
        token.classList.remove('show');
        setTimeout(() => { token.remove(); resolve(); }, 200);
      }, dur + 60);
    });
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function setWorker(el, hintEl, state, text) {
    el.classList.remove('dim', 'active');
    if (state === 'idle') el.classList.add('dim');
    if (state === 'busy') el.classList.add('active');
    hintEl.textContent = text;
  }

  function setActive(el, on) {
    el.classList.toggle('active', !!on);
  }

  async function workerLoad(workerEl, hintEl) {
    return withPutLock(async () => {
      if (queue.length >= CAP) {
        setWorker(workerEl, hintEl, 'idle', 'blocked (full)');
        return false;
      }
      const idx = nextIdx++;

      setPill(1);
      setStatus('Step 1 — Main sends index ' + idx + ' to a worker (not the file bytes)', 'info');
      mainHint.textContent = 'send idx ' + idx;
      setActive(main, true);
      setWorker(workerEl, hintEl, 'busy', 'receive idx ' + idx);
      await moveToken('index', 'idx ' + idx, main, workerEl, T_MOVE);
      setActive(main, false);
      mainHint.textContent = 'waiting / training';
      await sleep(T_PAUSE);

      setPill(2);
      setStatus('Step 2 — Worker reads sample ' + idx + ' from the filesystem', 'disk');
      fsHint.textContent = 'read file[' + idx + ']';
      setActive(fs, true);
      setWorker(workerEl, hintEl, 'busy', 'FS read ' + idx);
      await moveToken('data', 'file ' + idx, fs, workerEl, T_MOVE);
      await sleep(T_READ);
      setActive(fs, false);
      fsHint.textContent = 'dataset files';

      if (queue.length >= CAP) {
        setWorker(workerEl, hintEl, 'idle', 'blocked (full)');
        return false;
      }

      setPill(3);
      const bid = nextBatch++;
      setStatus('Step 3 — Worker puts batch B' + bid + ' into the RAM result queue', 'ok');
      setWorker(workerEl, hintEl, 'busy', 'put B' + bid);
      await moveToken('batch', 'B' + bid, workerEl, queueEl, T_MOVE);
      queue.push(bid);
      renderQueue();
      await sleep(T_PAUSE);
      setWorker(workerEl, hintEl, queue.length >= CAP ? 'idle' : 'busy',
        queue.length >= CAP ? 'blocked (full)' : 'ready');
      return true;
    });
  }

  async function consumeOne() {
    if (!queue.length) return false;
    const bid = queue.shift();
    renderQueue();

    setPill(4);
    setStatus('Step 4a — Main calls next(loader) and pulls B' + bid + ' from RAM', 'info');
    mainHint.textContent = 'next() → B' + bid;
    setActive(main, true);
    setActive(queueEl, true);
    await moveToken('batch', 'B' + bid, queueEl, main, T_MOVE);
    setActive(queueEl, false);
    await sleep(T_PAUSE);

    setStatus('Step 4b — Same main process copies B' + bid + ' to the GPU, then trains', 'gpu');
    setActive(gpu, true);
    gpuHint.textContent = 'train B' + bid;
    mainHint.textContent = '.to(GPU) B' + bid;
    await moveToken('batch', 'B' + bid, main, gpu, T_MOVE);
    await sleep(T_TRAIN);
    setActive(main, false);
    setActive(gpu, false);
    mainHint.textContent = 'train / next()';
    gpuHint.textContent = 'done B' + bid;
    return true;
  }

  async function bootstrap() {
    renderQueue();
    setStatus('Main starts 2 worker processes (still only one training / main process)', 'info');
    mainHint.textContent = 'start workers';
    setWorker(w1, w1Hint, 'busy', 'start');
    setWorker(w2, w2Hint, 'busy', 'start');
    await sleep(T_BOOT);

    setStatus('Workers fill the RAM queue first — then training can start', 'ok');
    const first = workerLoad(w1, w1Hint);
    await sleep(500);
    const second = workerLoad(w2, w2Hint);
    await Promise.all([first, second]);

    setStatus('Batches are ready in RAM — Main can call next(loader) now', 'info');
    await sleep(T_PAUSE);
    await consumeOne();
  }

  async function steadyState() {
    while (true) {
      if (queue.length >= CAP) {
        setWorker(w1, w1Hint, 'idle', 'blocked (full)');
        setWorker(w2, w2Hint, 'idle', 'blocked (full)');
        setStatus('RAM queue full — workers pause; Main keeps training via next()', 'warn');
        await consumeOne();
        setStatus('A RAM slot freed — workers resume reading from the filesystem', 'ok');
        continue;
      }

      if (queue.length >= 1) {
        setStatus('Overlap: Main trains on GPU while workers keep filling RAM', 'ok');
        const consume = consumeOne();
        const p1 = workerLoad(w1, w1Hint);
        await sleep(450);
        const p2 = workerLoad(w2, w2Hint);
        await Promise.all([consume, p1, p2]);
      } else {
        setStatus('RAM empty — Main / GPU wait until a worker finishes a batch', 'warn');
        gpuHint.textContent = 'idle (waiting)';
        mainHint.textContent = 'next() waiting';
        const p1 = workerLoad(w1, w1Hint);
        await sleep(450);
        const p2 = workerLoad(w2, w2Hint);
        await Promise.all([p1, p2]);
      }
      await sleep(700);
    }
  }

  (async function loop() {
    await bootstrap();
    await steadyState();
  })();
})();
</script>
</body>
</html>
